name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday midnight
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: rudragauswami
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&weeks=17
            dist/github-contribution-grid-snake.svg?palette=github&weeks=17

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
